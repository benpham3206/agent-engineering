name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"

permissions:
  contents: read

jobs:
  repository-security:
    name: repository-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked secret-file policy
        run: bash scripts/security-check.sh

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
